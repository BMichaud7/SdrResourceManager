# ════════════════════════════════════════════════════════════════════════
#  Shared credentials — Kubernetes / k3s Secrets
#
#  DO NOT commit real passwords.  This file uses placeholder values.
#  Before applying, populate with your actual credentials using ONE of:
#
#  Option A — kubectl create (recommended for first-time setup):
#    kubectl create secret generic sdr-credentials \
#      -n sdr-system \
#      --from-literal=amqp-username=sdr_ctrl \
#      --from-literal=amqp-password=<your-amqp-password> \
#      --from-literal=db-username=sdr \
#      --from-literal=db-password=<your-db-password>
#
#  Option B — edit this file (replace CHANGE_ME), then apply:
#    kubectl apply -f k8s/secrets.yaml
#
#  In production: use sealed-secrets or Vault agent injection instead of
#  storing plaintext in this file.
# ════════════════════════════════════════════════════════════════════════

---
# ── sdr-system Namespace ───────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: sdr-system
  labels:
    app.kubernetes.io/name: sdr-system

---
# ── Shared credential Secret ───────────────────────────────────────────
# All sdr-system pods read from this one Secret.
# Keys:
#   amqp-username  — Artemis AMQP user (matches ARTEMIS_USER env)
#   amqp-password  — Artemis AMQP password
#   db-username    — PostgreSQL user
#   db-password    — PostgreSQL password
apiVersion: v1
kind: Secret
metadata:
  name: sdr-credentials
  namespace: sdr-system
  labels:
    app.kubernetes.io/name: sdr-system
type: Opaque
stringData:
  amqp-username: sdr_ctrl
  amqp-password: CHANGE_ME   # ← set before applying
  db-username:   sdr
  db-password:   CHANGE_ME   # ← set before applying
