# ════════════════════════════════════════════════════════════════════════
#  PostgreSQL 16 — Kubernetes / k3s StatefulSet
#
#  Shared database for AcquisitionApp (detections), AnalysisApp
#  (analysis_results), and signal-logger (signals).
#
#  Prerequisites:
#    Create the password Secret before applying:
#      kubectl create secret generic sdr-credentials \
#        -n sdr-system \
#        --from-literal=username=sdr \
#        --from-literal=password=<your-password>
#
#  Apply:
#    kubectl apply -f k8s/postgres.yaml
# ════════════════════════════════════════════════════════════════════════

---
# ── ConfigMap: SQL schema ──────────────────────────────────────────────
# Single shared schema used by AcquisitionApp, AnalysisApp, and signal-logger.
# Signal identity: (freq ±10 kHz, modulation, bandwidth ±50%)
# Same freq + different modulation → separate row (different signal type).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: sdr-system
  labels:
    app: postgres
data:
  01_signals.sql: |
    CREATE TABLE IF NOT EXISTS signals (
        id              BIGSERIAL        PRIMARY KEY,
        first_seen      TIMESTAMPTZ      NOT NULL DEFAULT now(),
        last_seen       TIMESTAMPTZ      NOT NULL DEFAULT now(),
        freq_hz         DOUBLE PRECISION NOT NULL,
        freq_mhz        DOUBLE PRECISION NOT NULL,
        bandwidth_hz    DOUBLE PRECISION,
        power_db        REAL,
        snr_db          REAL,
        scanner_id      TEXT             NOT NULL DEFAULT '',
        channel         SMALLINT         NOT NULL DEFAULT 0,
        modulation      TEXT             NOT NULL DEFAULT '',
        mod_class       TEXT             NOT NULL DEFAULT '',
        is_ofdm         BOOLEAN          NOT NULL DEFAULT false,
        is_burst        BOOLEAN          NOT NULL DEFAULT false,
        is_fhss         BOOLEAN          NOT NULL DEFAULT false,
        symbol_rate_sps DOUBLE PRECISION,
        bit_rate_bps    DOUBLE PRECISION,
        hypothesis      TEXT             NOT NULL DEFAULT '',
        hyp_category    TEXT             NOT NULL DEFAULT '',
        hyp_confidence  REAL                      DEFAULT 0,
        classified      BOOLEAN          NOT NULL DEFAULT false,
        rule_confidence REAL                      DEFAULT 0,
        onnx_used       BOOLEAN          NOT NULL DEFAULT false,
        onnx_confidence REAL                      DEFAULT 0,
        fast_path       BOOLEAN          NOT NULL DEFAULT false,
        reject_reason   TEXT             NOT NULL DEFAULT '',
        hits            INTEGER          NOT NULL DEFAULT 1
    );
    CREATE INDEX IF NOT EXISTS idx_signals_freq    ON signals (freq_hz);
    CREATE INDEX IF NOT EXISTS idx_signals_time    ON signals (last_seen DESC);
    CREATE INDEX IF NOT EXISTS idx_signals_mod     ON signals (modulation);
    CREATE INDEX IF NOT EXISTS idx_signals_hyp     ON signals (hypothesis);
    CREATE INDEX IF NOT EXISTS idx_signals_unclass ON signals (classified, last_seen DESC)
        WHERE classified = false;

    DROP VIEW IF EXISTS recent_detections;
    DROP VIEW IF EXISTS recent_classifications;
    DROP VIEW IF EXISTS freq_activity;
    DROP VIEW IF EXISTS freq_classification_summary;
    DROP VIEW IF EXISTS classification_path_stats;
    DROP VIEW IF EXISTS recent_signals;
    CREATE OR REPLACE VIEW recent_signals AS
    SELECT last_seen,
           round((freq_hz/1e6)::numeric,3)         AS freq_mhz,
           round((bandwidth_hz/1e3)::numeric,1)    AS bw_khz,
           round(power_db::numeric,1)              AS power_db,
           round(snr_db::numeric,1)                AS snr_db,
           CASE WHEN modulation!='' THEN modulation ELSE '(unclassified)' END AS modulation,
           hypothesis,
           round(hyp_confidence::numeric,2)        AS hyp_conf,
           hits, scanner_id
    FROM signals WHERE last_seen > now() - interval '60 seconds'
    ORDER BY last_seen DESC;

    CREATE OR REPLACE VIEW freq_activity AS
    SELECT round((freq_hz/1e6)::numeric,3)         AS freq_mhz,
           CASE WHEN modulation!='' THEN modulation ELSE '(unclassified)' END AS modulation,
           round((bandwidth_hz/1e3)::numeric,1)    AS bw_khz,
           round(power_db::numeric,1)              AS power_db,
           round(snr_db::numeric,1)                AS snr_db,
           hypothesis, hits, first_seen, last_seen
    FROM signals ORDER BY last_seen DESC;

    CREATE OR REPLACE VIEW recent_classifications AS
    SELECT last_seen,
           round((freq_hz/1e6)::numeric,3)          AS freq_mhz,
           round((bandwidth_hz/1e3)::numeric,1)     AS bw_khz,
           round(snr_db::numeric,1)                 AS snr_db,
           modulation, mod_class, hypothesis,
           round(hyp_confidence::numeric,2)         AS hyp_conf,
           round(rule_confidence::numeric,2)        AS rule_conf,
           onnx_used, fast_path, hits, scanner_id
    FROM signals
    WHERE classified = true AND last_seen > now() - interval '60 seconds'
    ORDER BY last_seen DESC;

---
# ── StatefulSet ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sdr-system
  labels:
    app: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30

      # initContainer: apply schemas after postgres starts.
      # Uses pg_isready to wait for readiness before executing SQL.
      initContainers:
        - name: init-schema
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h localhost -U $POSTGRES_USER -d $POSTGRES_DB; do
                echo "waiting for postgres…"; sleep 2
              done
              for f in /docker-entrypoint-initdb.d/*.sql; do
                echo "applying $f"
                psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -f "$f"
              done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sdr-credentials
                  key: db-username
            - name: POSTGRES_DB
              value: sdr_scanner
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdr-credentials
                  key: db-password
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d

      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sdr-credentials
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdr-credentials
                  key: db-password
            - name: POSTGRES_DB
              value: sdr_scanner
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "sdr_scanner"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)", "-d", "sdr_scanner"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false

      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

---
# ── Services ───────────────────────────────────────────────────────────
# Headless service for StatefulSet DNS (postgres-0.postgres-headless…)
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: sdr-system
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      name: postgres

---
# Stable ClusterIP for app connections
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: sdr-system
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP

---
# ── NetworkPolicy ──────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
  namespace: sdr-system
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: sdr-acquisition
        - podSelector:
            matchLabels:
              app: sdr-analysis
        - podSelector:
            matchLabels:
              app: signal-logger
      ports:
        - port: 5432
          protocol: TCP

---
# ── PodDisruptionBudget ────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres-pdb
  namespace: sdr-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres
