name: CI

on:
  push:
    branches: ["main/1.0"]
  pull_request:
    branches: ["main/1.0"]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libsoapysdr-dev \
            libqpid-proton-cpp12-dev \
            libtinyxml2-dev \
            libfmt-dev libspdlog-dev \
            libfftw3-dev \
            uuid-dev

      - name: Clone SdrSdk and SdrTaskApi (sibling dependencies)
        run: |
          git clone --depth 1 --branch "main/1.0" \
            https://github.com/BMichaud7/SdrSdk.git \
            ../SdrSdk
          git clone --depth 1 --branch "main/1.0" \
            https://github.com/BMichaud7/SdrTaskApi.git \
            ../SdrTaskApi

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        # Exclude hardware-driver tests (RtlSdr/LimeSdr/UsrpB210) — require
        # physical SDR hardware or vendor drivers not installed in CI runners.
        run: |
          ctest --test-dir build --output-on-failure -V --timeout 60 \
            -E "RtlSdr|LimeSdr|UsrpB210|HackRf|PlutoSdr"
