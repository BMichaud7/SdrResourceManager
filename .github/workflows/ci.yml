name: CI

on:
  push:
    branches: ["main/1.0"]
  pull_request:
    branches: ["main/1.0"]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libsoapysdr-dev \
            libqpid-proton-cpp12-dev \
            libtinyxml2-dev \
            libfmt-dev libspdlog-dev \
            libfftw3-dev \
            uuid-dev

      - name: Clone SdrSdk and SdrTaskApi (sibling dependencies)
        run: |
          git clone --depth 1 --branch "main/1.0" \
            https://github.com/OpenRFStack/SdrSdk.git \
            ../SdrSdk
          git clone --depth 1 --branch "main/1.0" \
            https://github.com/OpenRFStack/SdrTaskApi.git \
            ../SdrTaskApi

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        # Exclude hardware tests (no physical devices) and the sustained stress
        # test (run separately below in its own process to avoid teardown races).
        run: |
          ctest --test-dir build --output-on-failure -V --timeout 60 \
            -E "RtlSdr|LimeSdr|UsrpB210|HackRf|PlutoSdr|IndepLo_Continuous|PreferredChannel_SharedLo_SameFreq|HundredDevices1000Rps"

      - name: Run sustained stress test (isolated process)
        # Run the 100-device 1000-req/s test in its own process so RM destructor
        # teardown races from prior tests don't interfere. 30s duration in CI.
        env:
          SRM_STRESS_DURATION_S: "30"
        run: |
          build/tests/sdr_tests \
            --gtest_filter='Stress.HundredDevices1000RpsFor3Minutes' \
            --gtest_color=no
