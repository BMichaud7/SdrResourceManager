##
## Qpid Dispatch Router — SDR Pi4 broker config
## Replaces ActiveMQ Artemis. Pure C, ~20 MB RAM vs ~300 MB for Artemis JVM.
##
## AMQP address semantics:
##   sdr.task.*   — balanced (anycast queue): one consumer gets each message
##   sdr.status   — multicast (topic): all subscribers receive
##   sdr.health   — multicast
##   rf.*         — multicast
##   gps.*        — multicast
##

router {
    mode: standalone
    id: sdr-pi4
    workerThreads: 2
}

listener {
    host: 0.0.0.0
    port: 5672
    role: normal
    authenticatePeer: no
    saslMechanisms: ANONYMOUS
    linkCapacity: 128
    idleTimeoutSeconds: 120
}

## Anycast queue addresses (request/response pairs)
address {
    prefix: sdr.task
    distribution: balanced
}

## Multicast topic addresses
address {
    prefix: sdr.status
    distribution: multicast
}

address {
    prefix: sdr.health
    distribution: multicast
}

address {
    prefix: rf.detections
    distribution: multicast
}

address {
    prefix: rf.alerts
    distribution: multicast
}

address {
    prefix: rf.p25
    distribution: multicast
}

address {
    prefix: gps.location
    distribution: multicast
}
